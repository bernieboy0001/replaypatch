<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sample App — ReplayPatch demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #11151c;
        color: #e6e6e6;
      }
      #openBtn {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #ff7a18;
        color: #0b0e14;
        font-weight: 700;
        cursor: pointer;
      }
      #modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
      }
      #modal .box {
        background: #1b2230;
        padding: 24px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <button id="openBtn">Open details</button>
    <div id="modal">
      <div class="box">Here are the details you asked for.</div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
