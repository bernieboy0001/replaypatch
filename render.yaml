services:
  - type: web
    name: replaypatch
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npx playwright install chromium && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: TARGET_URL
        value: file://./sample-app/index.html
      - key: TARGET_REPO
        value: ./sample-app
      - key: OG_RPC_URL
        value: https://evmrpc.0g.ai
      - key: OG_CHAIN_ID
        value: "16661"
      - key: OG_PRIVATE_KEY
        sync: false
      - key: OG_CONTRACT_ADDRESS
        value: 0x43D39f423baf019675D407C0444471da00cbDB11
      - key: OG_EXPLORER
        value: https://chainscan.0g.ai
      - key: OG_STORAGE_EXPLORER
        value: https://storagescan.0g.ai
